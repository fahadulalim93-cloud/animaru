[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmd = "npm install --legacy-peer-deps"

[phases.build]
cmd = "node scripts/generate-frames.mjs || true && (npx prisma generate || echo 'Prisma generate skipped') && npx next build"

[start]
cmd = "(npx prisma db push --accept-data-loss 2>/dev/null || true) && npx next start -p 3000"
