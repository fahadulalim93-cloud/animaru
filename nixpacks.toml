[phases.setup]

nixPkgs = ["nodejs_22"]

[phases.install]

cmd = "npm install --legacy-peer-deps"

[phases.build]

cmd = "node scripts/generate-frames.mjs && (prisma generate || echo 'Prisma generate skipped') && (prisma db push --accept-data-loss 2>/dev/null || echo 'Prisma db push skipped — will retry on start') && next build"

[start]

cmd = "(prisma db push --accept-data-loss 2>/dev/null || true) && next start -p 3000"
