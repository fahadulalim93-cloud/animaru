name = "luffytv-proxy"
main = "luffytv-proxy.js"
compatibility_date = "2024-09-01"
workers_dev = false

# Custom domain: api.luffytv.live → routes all traffic to this worker
# This bypasses the workers.dev subdomain rate limit (error 1027).
# Prerequisites:
#   1. luffytv.live zone must be added to your Cloudflare dashboard
#   2. DNS: api.luffytv.live → AAAA 100:: (proxied / orange cloud ON)
#   3. Then deploy: npx wrangler deploy

routes = [
  { pattern = "api.luffytv.live/*", zone_name = "luffytv.live" }
]

# Optional: KV namespace for persistent caching (instead of default edge cache)
# [[kv_namespaces]]
# binding = "IMAGE_CACHE"
# id = "your-kv-namespace-id"
