<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="ngGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: reduce) { .spin, .pulse { animation: none !important; } }
    </style>
  </defs>

  <!-- soft outer bloom, slow breathing pulse -->
  <circle cx="150" cy="150" r="118" fill="none" stroke="url(#ng)" stroke-width="10"
    opacity=".45" filter="url(#ngGlow)">
    <animate attributeName="opacity" values=".3;.6;.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating gradient ring, dashed so the motion actually reads -->
  <g style="transform-origin:150px 150px">
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="7s" repeatCount="indefinite"/>
    <circle cx="150" cy="150" r="112" fill="none" stroke="url(#ng)" stroke-width="4.5"
      stroke-dasharray="18 10" stroke-linecap="round"/>
  </g>

  <!-- thin crisp inner line for definition -->
  <circle cx="150" cy="150" r="112" fill="none" stroke="url(#ng)" stroke-width="1.5" opacity=".9"/>

  <!-- two orbiting sparks -->
  <g style="transform-origin:150px 150px">
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="-360 150 150" dur="5s" repeatCount="indefinite"/>
    <circle cx="150" cy="34" r="6" fill="#fff" filter="url(#ngGlow)"/>
  </g>
  <g style="transform-origin:150px 150px">
    <animateTransform attributeName="transform" type="rotate" from="180 150 150" to="-180 150 150" dur="5s" repeatCount="indefinite"/>
    <circle cx="150" cy="266" r="4.5" fill="#ec4899" filter="url(#ngGlow)"/>
  </g>
</svg>
