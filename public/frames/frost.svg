<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0feff"/>
      <stop offset="60%" stop-color="#8fe9f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="frostGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: reduce) { animateTransform, animate { display: none; } }
    </style>
  </defs>

  <!-- pulsing halo -->
  <circle cx="150" cy="150" r="114" fill="none" stroke="#67e8f9" stroke-width="6" opacity=".35" filter="url(#frostGlow)">
    <animate attributeName="r" values="110;118;110" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;.45;.25" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- slow-rotating ring of ice shards -->
  <g style="transform-origin:150px 150px" filter="url(#frostGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="18s" repeatCount="indefinite"/>
    <g fill="url(#ice)" stroke="#0891b2" stroke-width="1.5" stroke-linejoin="round">
      <path d="M150 20 L160 52 L140 52 Z"/>
      <path d="M150 280 L160 248 L140 248 Z"/>
      <path d="M20 150 L52 140 L52 160 Z"/>
      <path d="M280 150 L248 140 L248 160 Z"/>
      <path d="M62 62 L92 76 L76 92 Z"/>
      <path d="M238 62 L208 76 L224 92 Z"/>
      <path d="M62 238 L92 224 L76 208 Z"/>
      <path d="M238 238 L208 224 L224 208 Z"/>
    </g>
  </g>

  <!-- crisp inner ring -->
  <circle cx="150" cy="150" r="108" fill="none" stroke="#a5f3fc" stroke-width="2" opacity=".85"/>

  <!-- twinkling frost points -->
  <circle cx="150" cy="150" r="0" fill="none"/>
  <g fill="#ffffff">
    <circle cx="112" cy="46" r="2.4"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="228" cy="118" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="188" cy="252" r="2.2"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="196" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
