name: DesiDubAnime Auto-Scraper

on:
  schedule:
    # Run every 6 hours — checks for new anime/episodes and auto-pushes
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger too

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DesiDubAnime updater
        run: python3 scripts/desidub-updater.py
        env:
          GIT_AUTHOR_NAME: "LuffyTV Scraper"
          GIT_AUTHOR_EMAIL: "scraper@luffytv.live"
          GIT_COMMITTER_NAME: "LuffyTV Scraper"
          GIT_COMMITTER_EMAIL: "scraper@luffytv.live"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet src/data/desidub-anime.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LuffyTV Scraper"
          git config user.email "scraper@luffytv.live"
          git add src/data/desidub-anime.json
          git commit -m "scraper: desidubanime auto-update [skip ci]"
          git push
